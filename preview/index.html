<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sewa</title>
<style>
:root {
  --bg: #F5F3EF;
  --card: #FFFFFF;
  --card-2: #FAF8F5;
  --ink: #1C1B19;
  --ink-2: #4A4743;
  --muted: #7A766F;
  --line: rgba(28, 27, 25, 0.08);
  --line-2: rgba(28, 27, 25, 0.14);
  --accent: #0E6B5C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2F0EC;
  --accent-text: #0B5A4D;
  --red: #B42318;      --red-soft: #FBE8E6;
  --amber: #9A5B00;    --amber-soft: #FCEFD6;
  --green: #217346;    --green-soft: #E4F2E9;
  --blue: #2856A3;     --blue-soft: #E5ECF8;
  --grey-soft: #EEECE8;
  --shadow: 0 1px 2px rgba(28,27,25,.05), 0 4px 16px rgba(28,27,25,.05);
  --shadow-up: 0 -1px 0 var(--line), 0 -8px 24px rgba(28,27,25,.06);
  --scrim: rgba(20, 18, 15, 0.38);
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211;
    --card: #1D1C1A;
    --card-2: #242320;
    --ink: #F3F1EC;
    --ink-2: #CFCBC3;
    --muted: #9C978F;
    --line: rgba(255,255,255,.08);
    --line-2: rgba(255,255,255,.14);
    --accent: #3FB8A0;
    --accent-ink: #08241F;
    --accent-soft: #163A33;
    --accent-text: #7FD6C3;
    --red: #FF8A80;     --red-soft: #3A1E1B;
    --amber: #F2B75B;   --amber-soft: #382A13;
    --green: #7BCB95;   --green-soft: #1B3224;
    --blue: #93B4F0;    --blue-soft: #1C2740;
    --grey-soft: #2A2926;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --shadow-up: 0 -1px 0 var(--line);
    --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--accent-text); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- App frame ---------- */
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; }
.view { display: none; padding: calc(var(--safe-t) + 8px) 16px calc(110px + var(--safe-b)); }
.view.active { display: block; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.topbar { display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 2px 14px; gap: 12px; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .01em; }
h1 { font-size: 32px; line-height: 1.1; margin: 2px 0 0; font-weight: 750; letter-spacing: -.02em; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); box-shadow: var(--shadow); color: var(--ink-2); flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Summary tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
.tile { background: var(--card); border-radius: 16px; padding: 12px 12px 11px; box-shadow: var(--shadow); text-align: left; }
.tile .v { font-size: 24px; font-weight: 720; letter-spacing: -.02em; }
.tile .k { font-size: 12px; color: var(--muted); margin-top: 1px; line-height: 1.25; }
.tile.hot .v { color: var(--red); }

/* ---------- Sections ---------- */
.section { margin: 0 0 24px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 10px; }
.section-head h2 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.section-head .sub { font-size: 13px; color: var(--muted); }
.section-head .link { font-size: 15px; font-weight: 600; color: var(--accent-text); }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- Lease card ---------- */
.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px 14px; text-align: left; width: 100%; display: block; position: relative;
  transition: transform .12s ease;
}
.card:active { transform: scale(.985); }
.card-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card-title { font-weight: 650; font-size: 17px; letter-spacing: -.01em; line-height: 1.25; }
.card-title .unit { color: var(--muted); font-weight: 500; }
.card-people { color: var(--ink-2); font-size: 15px; margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-people .arrow { color: var(--muted); }
.card-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; margin-top: 8px; }
.card-meta b { color: var(--ink); font-weight: 600; }
.card-hint { margin-top: 10px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card-hint svg { width: 16px; height: 16px; flex: none; }
.progress { height: 4px; border-radius: 4px; background: var(--grey-soft); margin-top: 12px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

.pill {
  flex: none; font-size: 12.5px; font-weight: 650; padding: 4px 9px; border-radius: 999px;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; line-height: 1.2;
}
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.blue { background: var(--blue-soft); color: var(--blue); }
.pill.grey { background: var(--grey-soft); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }
.t-red { color: var(--red); } .t-amber { color: var(--amber); } .t-green { color: var(--green); } .t-blue { color: var(--blue); }

/* compact list row (tenancies tab) */
.list { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--card-2); }
.avatar {
  width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; background: var(--accent-soft); color: var(--accent-text); letter-spacing: -.02em;
}
.avatar.sale { background: var(--blue-soft); color: var(--blue); }
.avatar.dim { background: var(--grey-soft); color: var(--muted); }
.row .main { flex: 1; min-width: 0; }
.row .l1 { font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .l2 { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row .side { text-align: right; flex: none; }
.row .side .amt { font-weight: 600; font-size: 14.5px; }
.row .side .pill { margin-top: 4px; }

/* ---------- Empty / loading ---------- */
.empty { text-align: center; padding: 28px 20px; color: var(--muted); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
.empty .big { font-size: 30px; margin-bottom: 6px; }
.empty b { color: var(--ink); display: block; font-size: 16px; margin-bottom: 2px; }
.skeleton { background: var(--card); border-radius: var(--radius); height: 96px; position: relative; overflow: hidden; }
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--card-2), transparent);
  animation: shimmer 1.2s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* ---------- Search & chips ---------- */
.searchbar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: calc(var(--safe-t) + 6px) 0 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
}
.search {
  display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px;
  padding: 0 12px; height: 44px; box-shadow: var(--shadow);
}
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: none; flex: 1; font-size: 16px; min-width: 0; }
.search .clear { color: var(--muted); font-size: 14px; padding: 6px; display: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--card);
  font-size: 14px; font-weight: 600; color: var(--ink-2); box-shadow: var(--shadow); white-space: nowrap;
}
.chip .c { color: var(--muted); font-weight: 500; margin-left: 4px; }
.chip.on { background: var(--ink); color: var(--bg); }
.chip.on .c { color: var(--bg); opacity: .7; }
.result-note { font-size: 13px; color: var(--muted); margin: 6px 4px 10px; }
.more-btn { display: block; width: 100%; padding: 14px; text-align: center; font-weight: 600; color: var(--accent-text); }

/* building insight banner */
.bldg {
  background: var(--accent-soft); color: var(--accent-text); border-radius: 16px; padding: 12px 14px;
  margin-bottom: 12px; font-size: 14px;
}
.bldg b { font-size: 16px; display: block; color: var(--ink); margin-bottom: 2px; }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
  box-shadow: var(--shadow-up);
  padding-bottom: var(--safe-b);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; height: 62px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 8px; }
.tab svg { width: 25px; height: 25px; }
.tab.on { color: var(--accent-text); }
.tab-add { display: grid; place-items: center; padding-bottom: 10px; }
.tab-add span {
  width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: 0 6px 18px rgba(14,107,92,.35); transform: translateY(-10px);
}
.tab-add svg { width: 26px; height: 26px; }

/* ---------- Bottom sheet ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 560px; margin: 0 auto;
  background: var(--bg); border-radius: 22px 22px 0 0; max-height: 94vh; display: flex; flex-direction: column;
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
}
.sheet.on { transform: none; }
.sheet.dragging { transition: none; }
.scrim.dragging { transition: none; }
.sheet-grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 8px auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 10px; flex: none; }
.sheet-head h3 { margin: 0; font-size: 17px; font-weight: 700; text-align: center; flex: 1; }
.sheet-head .side-btn { min-width: 64px; font-size: 16px; color: var(--accent-text); font-weight: 500; text-align: left; }
.sheet-head .side-btn.right { text-align: right; font-weight: 700; }
.sheet-head .side-btn:disabled { opacity: .4; }
.sheet-body { overscroll-behavior: contain; overflow-y: auto; padding: 4px 16px calc(24px + var(--safe-b)); -webkit-overflow-scrolling: touch; }

/* detail */
.hero { text-align: center; padding: 6px 8px 18px; }
.hero .title { font-size: 24px; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; }
.hero .sub { color: var(--muted); margin-top: 4px; font-size: 15px; }
.hero .pill { margin-top: 10px; font-size: 13px; padding: 5px 11px; }
.countdown { font-size: 44px; font-weight: 780; letter-spacing: -.03em; line-height: 1; margin-top: 14px; }
.countdown small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }

.timeline { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 16px 14px; margin-bottom: 14px; }
.tl-track { position: relative; height: 6px; border-radius: 6px; background: var(--grey-soft); margin: 10px 4px 0; }
.tl-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); }
.tl-dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--card); border: 3px solid var(--grey-soft); }
.tl-dot.notice { border-color: var(--amber); }
.tl-dot.today { border-color: var(--accent); width: 18px; height: 18px; margin: -9px 0 0 -9px; }
.tl-labels { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.tl-labels b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
.tl-labels > div:last-child { text-align: right; }
.tl-notice { position: relative; height: 34px; margin: 8px 4px 0; font-size: 12.5px; }
.tl-notice > div { position: absolute; top: 0; transform: translateX(-50%); text-align: center; white-space: nowrap; color: var(--amber); }
.tl-notice b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }

.group { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
.group-label { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 18px 6px 8px; }
.kv { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 50px; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--muted); font-size: 15px; flex: none; width: 96px; }
.kv .v { flex: 1; font-size: 15.5px; min-width: 0; word-break: break-word; }
.kv .acts { display: flex; gap: 8px; flex: none; }
.round {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-text);
}
.round svg { width: 18px; height: 18px; }
.round.wa { background: #E3F5E8; color: #1E8E4A; }
@media (prefers-color-scheme: dark) { .round.wa { background: #173323; color: #6FD496; } }
.toggle-row { justify-content: space-between; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 31px; background: var(--line-2); transition: background .2s; }
.switch span::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s;
}
.switch input:checked + span { background: #34C759; }
.switch input:checked + span::after { transform: translateX(20px); }

.actions { display: grid; gap: 10px; margin: 18px 0 6px; }
.actions.two { grid-template-columns: 1fr 1fr; }
.btn {
  height: 50px; border-radius: 14px; font-weight: 650; font-size: 16px; display: flex;
  align-items: center; justify-content: center; gap: 8px; width: 100%;
}
.btn svg { width: 19px; height: 19px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn.danger { background: var(--card); color: var(--red); box-shadow: var(--shadow); }
.btn.ghost { color: var(--muted); font-weight: 500; font-size: 15px; height: 44px; }
.btn:disabled { opacity: .5; }

/* forms */
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
.field:last-child { border-bottom: 0; }
.field label { width: 104px; flex: none; font-size: 15px; color: var(--ink-2); }
.field input, .field select, .field textarea {
  flex: 1; border: 0; outline: 0; background: none; font-size: 16px; min-width: 0; padding: 14px 0;
}
.field textarea { resize: none; min-height: 72px; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .75; }
.field input[type=date] { -webkit-appearance: none; appearance: none; text-align: left; min-height: 50px; }
.field .prefix { color: var(--muted); }
.field.block { display: block; padding: 12px 16px; }
.field.block label { display: block; width: auto; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.seg { display: flex; background: var(--grey-soft); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { flex: 1; height: 34px; border-radius: 9px; font-size: 14.5px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.calc {
  background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; margin: 0 0 14px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.calc .k { font-size: 12.5px; color: var(--accent-text); font-weight: 600; }
.calc .v { font-size: 16px; font-weight: 700; color: var(--ink); margin-top: 1px; }
.hint { font-size: 13px; color: var(--muted); margin: -6px 6px 14px; line-height: 1.4; }
.hint b { color: var(--ink-2); }
.quick { display: flex; gap: 8px; padding: 0 16px 12px; flex-wrap: wrap; }
.quick button { height: 30px; padding: 0 12px; border-radius: 999px; background: var(--grey-soft); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.suggest { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; scrollbar-width: none; }
.suggest::-webkit-scrollbar { display: none; }
.suggest button { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 13.5px; font-weight: 600; }

/* insights */
.chart { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 16px 12px; margin-bottom: 14px; }
.chart h4 { margin: 0; font-size: 16px; font-weight: 700; }
.chart .cap { font-size: 13px; color: var(--muted); margin: 2px 0 14px; }
.cols { display: flex; align-items: flex-end; gap: 4px; height: 150px; border-bottom: 1px solid var(--line-2); position: relative; }
.col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
.col .bar { width: 100%; max-width: 26px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.col .bar.soft { background: color-mix(in srgb, var(--accent) 45%, var(--card)); }
.col .val { font-size: 11px; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; visibility: hidden; }
.col.show .val, .col:hover .val { visibility: visible; }
.col.sel .bar { background: var(--ink); }
.xlabels { display: flex; gap: 4px; margin-top: 6px; }
.xlabels span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
.hbars { display: grid; gap: 10px; }
.hbar .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
.hbar .top span:last-child { color: var(--muted); }
.hbar .track { height: 8px; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.big-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.big-stats .tile .v { font-size: 26px; }

/* notes */
.card-note {
  margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--card-2);
  font-size: 13.5px; color: var(--ink-2); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.note-item { display: block; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.note-item:last-child { border-bottom: 0; }
.note-item:active { background: var(--card-2); }
.note-item .h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.note-item .h b { font-size: 15.5px; font-weight: 600; }
.note-item .h span { font-size: 12.5px; color: var(--muted); flex: none; }
.note-item .who { font-size: 13.5px; color: var(--muted); margin-top: 1px; }
.note-item .txt { font-size: 15px; margin-top: 8px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.note-item .txt .lab { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: block; margin-top: 6px; }
.note-item .txt .lab:first-child { margin-top: 0; }
.status-line {
  display: inline-flex; align-items: center; gap: 6px; margin: 0 2px 16px; font-size: 13.5px; font-weight: 600;
  padding: 6px 11px; border-radius: 999px;
}
.status-line.on { background: var(--green-soft); color: var(--green); }
.status-line.off { background: var(--amber-soft); color: var(--amber); }
.status-line svg { width: 15px; height: 15px; }

/* contacts */
.sugg { margin: 0; padding: 0 12px 10px; display: none; }
.sugg.on { display: block; }
.sugg button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 12px;
  background: var(--card-2); margin-top: 6px;
}
.sugg button:active { background: var(--accent-soft); }
.sugg .note { font-size: 13px; color: var(--muted); padding: 6px 4px 0; }
.cav {
  width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-text); font-weight: 700; font-size: 13px;
}
.cmain { flex: 1; min-width: 0; }
.cmain b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmain span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field .pick {
  width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-text);
}
.field .pick svg { width: 18px; height: 18px; }
.phone-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px; }
.phone-chips:not(:empty) { padding-bottom: 12px; }
.phone-chips button { height: 30px; padding: 0 11px; border-radius: 999px; background: var(--grey-soft); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.phone-chips button.on { background: var(--accent); color: var(--accent-ink); }
.picker {
  position: fixed; inset: 0; z-index: 60; background: var(--bg); max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.picker.on { transform: none; }
.picker-head { padding: calc(var(--safe-t) + 10px) 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.picker-top { display: flex; align-items: center; justify-content: space-between; }
.picker-top h3 { margin: 0; font-size: 17px; }
.picker-top button { color: var(--accent-text); font-size: 16px; min-width: 60px; text-align: left; }
.picker-list { flex: 1; overflow-y: auto; padding: 0 16px calc(20px + var(--safe-b)); }
.picker-list .crow { display: flex; align-items: center; gap: 12px; padding: 11px 4px; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.picker-list .crow:active { background: var(--card-2); }
.nudge {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 22px;
}
.nudge .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.nudge .ic svg { width: 21px; height: 21px; }
.nudge b { display: block; font-size: 15.5px; }
.nudge span { font-size: 13.5px; color: var(--muted); }
.match-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.match-card .mh { padding: 12px 16px 8px; }
.match-card .mh b { font-size: 16px; }
.match-card .mh span { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
.mopt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 16px; border-top: 1px solid var(--line); }
.mopt .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; display: grid; place-items: center; }
.mopt.on .radio { border-color: var(--accent); }
.mopt.on .radio::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); }
.mopt .skip { color: var(--muted); font-size: 14.5px; }
.inline-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--accent-text); }
.inline-link svg { width: 15px; height: 15px; }

.auto-note { display: none; align-items: center; gap: 6px; padding: 0 16px 12px; font-size: 13.5px; color: var(--green); font-weight: 600; }
.auto-note.on { display: flex; }
.auto-note svg { width: 15px; height: 15px; flex: none; }
.auto-note button { color: var(--accent-text); font-weight: 600; margin-left: auto; }
.done-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
.done-row:first-of-type { border-top: 0; }
.done-row .cmain b { font-size: 14.5px; }
.done-row .undo { color: var(--accent-text); font-weight: 600; font-size: 14px; flex: none; }
.done-row.undone { opacity: .45; }
.done-row.undone .undo { color: var(--muted); }

/* commission chart */
.col .stack { width: 100%; max-width: 26px; display: flex; flex-direction: column; border-radius: 4px 4px 0 0; overflow: hidden; min-height: 0; }
.col .stack .bar { width: 100%; max-width: none; border-radius: 0; min-height: 0; }
.col .stack .bar + .bar { border-top: 2px solid var(--card); }
.col .bar.due, .lg.due { background: color-mix(in srgb, var(--accent) 35%, var(--card)); }
.lg.got { background: var(--accent); }
.legend-row { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin: -6px 0 12px; }
.legend-row i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.col.sel .stack .bar { background: var(--ink); }
.col.sel .stack .bar.due { background: color-mix(in srgb, var(--ink) 40%, var(--card)); }
.row.sub { padding-left: 28px; background: var(--card-2); }

/* renewal messages */
.msg-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.msg-row:last-child { border-bottom: 0; }
.msg-row .main { flex: 1; min-width: 0; }
.msg-row .l1 { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-row .l2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role-chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; margin-right: 6px; vertical-align: 1px; }
.role-chip.owner { background: var(--blue-soft); color: var(--blue); }
.role-chip.tenant { background: var(--accent-soft); color: var(--accent-text); }
.send-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px;
  background: #25D366; color: #fff; font-weight: 700; font-size: 14px; }
.send-btn svg { width: 17px; height: 17px; }
.send-btn.ghost { background: var(--grey-soft); color: var(--ink-2); }
.msg-row .confirm { display: flex; flex-direction: column; gap: 6px; flex: none; }
.msg-row .confirm .send-btn { height: 32px; justify-content: center; }
.sent-tag { flex: none; font-size: 13px; font-weight: 600; color: var(--green); }
.tpl { width: 100%; border: 0; outline: 0; background: none; font: inherit; font-size: 15.5px; line-height: 1.45; padding: 14px 16px; min-height: 160px; resize: vertical; }
.ph { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
.ph button { height: 28px; padding: 0 10px; border-radius: 999px; background: var(--grey-soft); font-size: 13px; font-weight: 600; color: var(--ink-2); }

.wa-choice {
  position: fixed; left: 8px; right: 8px; bottom: calc(8px + var(--safe-b)); z-index: 67; max-width: 544px; margin: 0 auto;
  transform: translateY(120%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
}
.wa-choice.on { transform: none; }
.wa-choice .box { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
.wa-choice .ttl { padding: 12px 16px; font-size: 13px; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
.wa-choice a, .wa-choice button { display: block; width: 100%; padding: 15px 16px; text-align: center; font-size: 17px; color: var(--accent-text); border-bottom: 1px solid var(--line); }
.wa-choice a:last-child, .wa-choice .box button:last-child { border-bottom: 0; }
.wa-choice a small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.wa-choice .cancel { background: var(--card); border-radius: 16px; font-weight: 700; border: 0; }

.holdable { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; transition: background .15s, transform .15s; }
.holdable.holding { background: var(--accent-soft); transform: scale(.985); }
.kv.editing { background: var(--accent-soft); }
.pe-wrap { overflow: hidden; transition: height .26s cubic-bezier(.2,.8,.2,1), opacity .2s; background: var(--card-2); border-bottom: 1px solid var(--line); }
.pe-wrap .field { background: var(--card); margin: 8px 12px 0; border-radius: 12px; border-bottom: 0; }
.pe-wrap .add-field { margin: 8px 12px 0; width: calc(100% - 24px); border-radius: 12px; background: var(--card); border-bottom: 0; }
.od-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
.od-row input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin-top: 2px; }
.od-row b { display: block; font-size: 15.5px; font-weight: 600; }
.od-row small { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
.pe-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px 12px; }
.pe-btns .btn { height: 42px; font-size: 15px; }
.add-field { display: block; width: 100%; text-align: left; padding: 14px 16px; font-size: 15.5px; color: var(--accent-text); font-weight: 600; border-bottom: 1px solid var(--line); }
.add-field:last-child { border-bottom: 0; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(86px + var(--safe-b)); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14.5px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: all .25s; z-index: 80; max-width: calc(100% - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* confirm dialog */
.dialog {
  position: fixed; left: 50%; top: 50%; z-index: 70; width: min(320px, calc(100% - 48px));
  transform: translate(-50%, -50%) scale(.96); opacity: 0; pointer-events: none; transition: all .18s;
  background: var(--card); border-radius: 18px; overflow: hidden; text-align: center;
}
.dialog.on { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
.dialog .dbody { padding: 20px 18px 16px; }
.dialog h4 { margin: 0 0 6px; font-size: 17px; }
.dialog p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.4; }
.dialog .dbtns { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.dialog .dbtns button { height: 48px; font-size: 16px; color: var(--accent-text); }
.dialog .dbtns button + button { border-left: 1px solid var(--line); font-weight: 700; }
.dialog .dbtns button.danger { color: var(--red); }
#dialogScrim { z-index: 65; }

.settings-note { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin: 8px 6px 0; }
.settings-note ol { padding-left: 18px; margin: 6px 0 0; }
</style>
</head>

<script>
/* ============================================================
   Server bridge. In Apps Script this is google.script.run;
   the local preview injects a mock with the same shape.
   ============================================================ */
function api(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      reject(e && e.message ? e : new Error(String(e)));
    });
    r[name].apply(r, args);
  });
}

/* ============================================================
   Dates & formatting
   ============================================================ */
var DAY = 86400000;
function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  var m = s.match(/^(\d{1,2})[\/.-]+(\d{1,2})[\/.-]+(\d{2,4})$/);
  if (m) {
    var d = +m[1], mo = +m[2], y = +m[3];
    if (y < 100) y += 2000;
    if (mo > 12 && d <= 12) { var sw = d; d = mo; mo = sw; }   // typed month-first, e.g. 9/30/2024
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return new Date(y, mo - 1, d);
  }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}
function iso(d) { if (!d) return ''; var p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function dmy(d) { return d ? d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear() : ''; }
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d) { return d ? d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear() : '-'; }
function fmtShort(d) { return d ? d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== today().getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : '') : '-'; }
function addMonths(d, m) {
  var r = new Date(d.getFullYear(), d.getMonth() + m, 1);
  var last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
  r.setDate(Math.min(d.getDate(), last)); return r;
}
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function daysBetween(a, b) { return Math.round((b - a) / DAY); }
function money(n) {
  if (n == null || isNaN(n)) return '-';
  var dec = Math.round(n) !== n;
  return 'RM ' + n.toLocaleString('en-MY', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: 2 });
}
function moneyShort(n) {
  if (n >= 1e6) return 'RM ' + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'm';
  if (n >= 1e4) return 'RM ' + Math.round(n / 1e3) + 'k';
  return money(n);
}
function parseMoney(s) { var n = parseFloat(String(s || '').replace(/[^0-9.]/g, '')); return isNaN(n) ? null : n; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function initials(s) {
  var w = String(s || '?').replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/);
  return ((w[0] || '?')[0] + (w[1] ? w[1][0] : (w[0] || '')[1] || '')).toUpperCase();
}
function phoneDigits(p) {
  var d = String(p || '').replace(/[^0-9+]/g, '');
  if (!d) return '';
  if (d[0] === '+') return d.slice(1);
  if (d.indexOf('60') === 0) return d;

function outcomeOf(status) {
  var s = String(status || '').toLowerCase().trim();
  if (!s || s === '-') return '';

  if (/(not|non)[\s-]*renew/.test(s)) return 'moving';
  if (/renew|extension/.test(s)) return 'renewed';
  if (/expired|laps|termination|undercut|end service|uncontactable|sold|own unit|forfeit|replacement|tenant chan|completed|sale/.test(s)) return 'moving';

}

  p = String(p || '');

  if ((m = t.match(/^([\d.]+)\s*\/\s*12$/))) return Math.round(parseFloat(m[1]));
  var n = parseFloat(t);

  return n >= 6 && Math.round(n) === n ? n : Math.round(n * 12);
}

  if (months % 12 === 0) return (months / 12) + (months === 12 ? ' year' : ' years');
  return months + ' months';
}

  return months % 12 === 0 ? String(months / 12) : months + '/12';
}

/* She copies live leases into a section at the bottom of the sheet, so the
   same lease can appear twice. Show it once (the lowest row, her working
   copy) and remember the other rows so changes are written to all of them. */
function dedupe(rows) {
  var byKey = {}, out = [];
  rows.forEach(function (r) {
    if (!r.start || !r.end) { r.dupes = []; out.push(r); return; }
    var k = [r.residence, r.parties, iso(r.start), iso(r.end)].join('|').toLowerCase().replace(/\s+/g, ' ');
    var prev = byKey[k];
    if (!prev) { r.dupes = []; byKey[k] = r; out.push(r); return; }
    // keep the later row, but take the most informative status/remarks
    r.dupes = prev.dupes.concat([{ row: prev.row, residence: prev.raw.residence, parties: prev.raw.parties }]);
    if (!r.status && prev.status) { r.status = prev.status; r.outcome = prev.outcome; r.phase = prev.phase; }
    if (!r.remarks && prev.remarks) r.remarks = prev.remarks;
    out[out.indexOf(prev)] = r; byKey[k] = r;
  });
  return out;
}

var PLAIN_STATUS = /^(renewed|renewal|expired|completed|lapsed?|early termination|sale|-|not renewed|non renewed|aborted|renewed but no fee|renewed no fee|short renewal|short extension|own renewal|owner self renew|self extension|end service|uncontactable|unit sold|own unit)$/i;

    .filter(function (w) { return w && !TITLES.test(w); });

/* Score how well a contact matches a name as she writes it in the sheet. */
function scoreContact(c, want) {
  if (!want.length) return 0;
  var have = c.key.split(' ');
  var joined = want.join(' ');
  if (c.key === joined) return 100;
  var whole = want.filter(function (w) { return have.indexOf(w) >= 0; }).length;
  if (whole === want.length) return want.length > 1 ? 90 : 75;
  if (whole && whole >= want.length - 1 && want.length > 1) return 60;

  return prefix ? 50 : 0;
}
function findContacts(name, limit) {

  var want = nameTokens(name);
  if (!want.length) return [];

    .filter(function (x) { return x.s >= 50; })
    .sort(function (a, b) { return b.s - a.s || a.c.n.length - b.c.n.length; })

function renderToday() {

  document.getElementById('todayDate').textContent = t.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

  var rows = STATE.rows;

    return false;
  }).sort(function (a, b) { return a.end - b.end; });

  var fees = [];

  var h = '';

    '<button class="tile" data-jump="active"><div class="v num">' + active.length + '</div><div class="k">Active tenancies</div></button>' +
    '<button class="tile" data-jump="active"><div class="v num">' + moneyShort(rent) + '</div><div class="k">Monthly rent managed</div></button>' +
    '</div>';

  h += nudge;

      '<div class="list">' + due.slice(0, 12).map(msgRowHtml).join('') + '</div>' +
      (due.length > 12 ? '<div class="result-note">' + (due.length - 12) + ' more – they\u2019ll appear as you send these</div>' : '') + '</div>';
  }
  h += '<div class="section"><div class="section-head"><h2>Needs attention</h2><span class="sub">Next 90 days</span></div>';
  if (act.length) h += '<div class="stack">' + act.map(function (r) { return leaseCard(r); }).join('') + '</div>';
  else h += empty('🌿', 'All clear', 'No leases end in the next 90 days.');

  if (fees.length) {
    h += '<div class="section"><div class="section-head"><h2>Fees to collect</h2><span class="sub">' + fees.length + '</span></div><div class="stack">';
    h += fees.map(function (f) {
      var overdue = f.days < 0;

  document.getElementById('todayBody').innerHTML = h;
  bind('remStatus', openSettings);
  bind('matchNudge', openMatcher);
}

/* Home search: property, owner or tenant. Active leases first. */
function searchRows(q) {
  var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  return STATE.rows.filter(function (r) { return terms.every(function (t) { return r.search.indexOf(t) >= 0; }); })
    .sort(function (a, b) {
      var ra = a.phase === 'active' || a.phase === 'moving' ? 0 : 1, rb = b.phase === 'active' || b.phase === 'moving' ? 0 : 1;
      return ra - rb || (ra === 0 ? a.end - b.end : b.sortDate - a.sortDate);
    });
}
function renderHomeSearch() {
  var q = document.getElementById('hq').value.trim();
  var res = document.getElementById('homeResults'), body = document.getElementById('todayBody');
  document.getElementById('hqClear').style.display = q ? 'block' : 'none';

  var hits = searchRows(q);

  else {

    var past = hits.filter(function (r) { return !(r.phase === 'active' || r.phase === 'moving'); });
    if (active.length) h += '<div class="section-head"><h2>Current</h2><span class="sub num">' + active.length + '</span></div><div class="list" style="margin-bottom:18px">' + active.slice(0, 30).map(listRow).join('') + '</div>';
    if (past.length) h += '<div class="section-head"><h2>Past &amp; other</h2><span class="sub num">' + past.length + '</span></div><div class="list">' + past.slice(0, 30).map(listRow).join('') + '</div>' +
      (past.length > 30 ? '<button class="more-btn" id="hqAll">See all ' + hits.length + ' in Tenancies</button>' : '');
  }
  res.innerHTML = h;

var hqTimer;
document.getElementById('hq').addEventListener('input', function () { clearTimeout(hqTimer); hqTimer = setTimeout(renderHomeSearch, 100); });
document.getElementById('hqClear').onclick = function () { document.getElementById('hq').value = ''; renderHomeSearch(); };

/* ============================================================
   TENANCIES (search + filters)
   ============================================================ */
var FILTERS = [
  { id: 'active', label: 'Active', test: function (r) { return r.isRental && (r.phase === 'active' || r.phase === 'moving'); } },
  { id: 'soon', label: 'Ending ≤ 90d', test: function (r) { return r.isRental && (r.phase === 'active' || r.phase === 'moving') && r.daysLeft <= 90; } },
  { id: 'moving', label: 'Expired / ending', test: function (r) { return r.phase === 'moving'; } },
  { id: 'ended', label: 'Past', test: function (r) { return r.phase === 'ended'; } },
  { id: 'sale', label: 'Sales', test: function (r) { return r.isSale && !r.aborted; } },
  { id: 'aborted', label: 'Aborted', test: function (r) { return r.aborted; } },
  { id: 'all', label: 'All', test: function () { return true; } }
];
function renderChips(counts) {
  document.getElementById('chips').innerHTML = FILTERS.map(function (f) {
    return '<button class="chip' + (STATE.filter === f.id ? ' on' : '') + '" data-filter="' + f.id + '">' +
      esc(f.label) + '<span class="c num">' + counts[f.id] + '</span></button>';
  }).join('');
}
function renderList() {
  var q = STATE.q.trim().toLowerCase();
  var terms = q ? q.split(/\s+/) : [];
  var base = STATE.rows.filter(function (r) { return terms.every(function (t) { return r.search.indexOf(t) >= 0; }); });
  var counts = {};
  FILTERS.forEach(function (f) { counts[f.id] = base.filter(f.test).length; });
  renderChips(counts);
  document.getElementById('qClear').style.display = q ? 'block' : 'none';

  var f = FILTERS.filter(function (x) { return x.id === STATE.filter; })[0];
  var list = base.filter(f.test);
  var activeLike = STATE.filter === 'active' || STATE.filter === 'soon' || STATE.filter === 'moving';
  list.sort(activeLike ? function (a, b) { return a.end - b.end; } : function (a, b) { return b.sortDate - a.sortDate; });

  var h = '';
  // building summary when the search matches one building
  if (q) {
    var names = {};
    base.forEach(function (r) { names[r.residence] = (names[r.residence] || 0) + 1; });
    var keys = Object.keys(names);
    if (keys.length === 1 || (keys.length && keys.every(function (k) { return k.toLowerCase().indexOf(q) >= 0; }) && keys.length <= 2)) {
      var b = keys.sort(function (a, b) { return names[b] - names[a]; })[0];
      var bi = buildingInfo(b);
      if (bi) h += '<div class="bldg"><b>' + esc(b) + '</b>' + bi + '</div>';
    }
  }
  if (!list.length) {
    var hidden = FILTERS.filter(function (x) { return x.id !== STATE.filter && x.id !== 'all' && counts[x.id]; });
    h += empty('🔎', q ? 'No matches here' : 'Nothing in this list',
      hidden.length ? 'Try ' + hidden.map(function (x) { return x.label + ' (' + counts[x.id] + ')'; }).join(', ') + '.' : '');
  } else {
    h += '<div class="result-note num">' + list.length + (list.length === 1 ? ' record' : ' records') + '</div>';
    h += '<div class="list">' + list.slice(0, STATE.limit).map(listRow).join('') + '</div>';
    if (list.length > STATE.limit) h += '<button class="more-btn" id="showMore">Show ' + Math.min(60, list.length - STATE.limit) + ' more</button>';
  }
  document.getElementById('listBody').innerHTML = h;
}
function buildingInfo(name) {
  var cut = addMonths(today(), -36);
  var deals = STATE.rows.filter(function (r) { return r.residence === name && !r.aborted; });
  var recent = deals.filter(function (r) { return r.isRental && r.price && (r.date || r.start) >= cut; }).map(function (r) { return r.price; });
  var s = deals.length + ' deals with you';
  if (recent.length) {
    recent.sort(function (a, b) { return a - b; });
    var lo = recent[0], hi = recent[recent.length - 1];
    s += ' · rents in the last 3 years ' + (lo === hi ? money(lo) : money(lo) + ' – ' + money(hi));
  }
  return s;
}

/* ============================================================
   COMMISSION – take-home per month
   ============================================================ */
function monthKey(d) { return d.getFullYear() * 12 + d.getMonth(); }
function monthName(k, long) { var y = Math.floor(k / 12), m = k % 12; return long ? ['January','February','March','April','May','June','July','August','September','October','November','December'][m] + ' ' + y : MON[m] + (m === 0 ? " '" + String(y).slice(2) : ''); }
/* Each commission once: collected ones in the month collected, the rest in the deal month. */
function commissionEntries() {
  return STATE.rows.filter(function (r) { return r.fee && !r.aborted; }).map(function (r) {
    var when = r.feeCollected ? (r.collectedOn || r.date || r.start) : (r.date || r.start);
    return when ? { r: r, amt: r.fee, collected: r.feeCollected, k: monthKey(when) } : null;
  }).filter(Boolean);
}
function moneyTile(n) {
  if (n >= 1e6) return 'RM ' + (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'm';
  if (n >= 1000) return 'RM ' + (n / 1000).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k';
  return 'RM ' + Math.round(n);
}
function renderIncome() {
  var t = today(), nowK = monthKey(t), list = commissionEntries();
  var sum = function (f) { return list.filter(f).reduce(function (n, e) { return n + e.amt; }, 0); };
  var thisMonth = sum(function (e) { return e.k === nowK; });
  var thisYear = sum(function (e) { return Math.floor(e.k / 12) === t.getFullYear(); });
  var pending = sum(function (e) { return !e.collected; });
  var h = '<div class="section"><div class="section-head"><h2>Take-home</h2><span class="sub">Commission</span></div>';
  if (!list.length) {
    h += empty('💰', 'No commission recorded yet', 'Open a lease and enter its commission. It also goes into column E of your sheet.');
    return h + '</div>';
  }
  h += '<div class="tiles">' +
    '<div class="tile"><div class="v num">' + moneyTile(thisMonth) + '</div><div class="k">' + MON[t.getMonth()] + ' so far</div></div>' +
    '<div class="tile"><div class="v num">' + moneyTile(thisYear) + '</div><div class="k">' + t.getFullYear() + ' total</div></div>' +
    '<div class="tile"><div class="v num' + (pending ? ' t-amber' : '') + '">' + moneyTile(pending) + '</div><div class="k">To collect</div></div></div>';

  // last 12 months, collected vs still to collect (stacked)
  var months = [];
  for (var i = 11; i >= 0; i--) {
    var k = nowK - i;
    months.push({ k: k, got: sum(function (e) { return e.k === k && e.collected; }), due: sum(function (e) { return e.k === k && !e.collected; }) });
  }
  var max = Math.max.apply(null, months.map(function (m) { return m.got + m.due; }).concat([1]));
  h += '<div class="chart"><h4>Commission by month</h4><div class="cap">Last 12 months · tap a bar for the cases</div>' +
    '<div class="legend-row"><span><i class="lg got"></i>Collected</span><span><i class="lg due"></i>Still to collect</span></div>' +
    '<div class="cols" role="img" aria-label="' + esc(months.map(function (m) { return monthName(m.k, true) + ' ' + money(m.got + m.due); }).join(', ')) + '">' +
    months.map(function (m) {
      var tot = m.got + m.due;
      return '<button class="col' + (m.k === STATE.incomeMonth ? ' sel' : '') + (tot && (m.k === nowK || tot === max) ? ' show' : '') + '" data-month="' + m.k + '" title="' + esc(monthName(m.k, true) + ': ' + money(tot)) + '">' +
        '<span class="val num">' + (tot ? moneyShort(tot).replace('RM ', '') : '') + '</span>' +
        '<span class="stack" style="height:' + (tot / max * 100).toFixed(1) + '%">' +
        (m.due ? '<span class="bar due" style="flex:' + m.due + '"></span>' : '') +
        (m.got ? '<span class="bar" style="flex:' + m.got + '"></span>' : '') + '</span></button>';
    }).join('') + '</div><div class="xlabels">' + months.map(function (m) { return '<span>' + monthName(m.k) + '</span>'; }).join('') + '</div></div>';

  // month-by-month list (every month with income), newest first
  var byK = {};
  list.forEach(function (e) { (byK[e.k] = byK[e.k] || []).push(e); });
  var keys = Object.keys(byK).map(Number).sort(function (a, b) { return b - a; });
  if (STATE.incomeMonth == null || !byK[STATE.incomeMonth]) STATE.incomeMonth = keys[0];
  h += '<div class="section-head" style="margin-top:6px"><h2 style="font-size:17px">By month</h2></div><div class="list">' +
    keys.slice(0, 24).map(function (k) {
      var es = byK[k], tot = es.reduce(function (n, e) { return n + e.amt; }, 0), due = es.filter(function (e) { return !e.collected; }).length;
      var open = k === STATE.incomeMonth;
      return '<button class="row" data-month="' + k + '"><div class="main"><div class="l1">' + monthName(k, true) + '</div><div class="l2">' + es.length + (es.length === 1 ? ' case' : ' cases') + (due ? ' · ' + due + ' to collect' : ' · all collected') + '</div></div>' +
        '<div class="side"><div class="amt num">' + money(tot) + '</div></div></button>' +
        (open ? es.sort(function (a, b) { return b.amt - a.amt; }).map(function (e) {
          return '<button class="row sub" data-open="' + e.r._i + '"><div class="main"><div class="l1">' + esc(e.r.residence) + (e.r.unit ? ' · ' + esc(e.r.unit) : '') + '</div><div class="l2">' + esc([e.r.landlord, e.r.tenant].filter(Boolean).join(' → ')) + '</div></div>' +
            '<div class="side"><div class="amt num">' + money(e.amt) + '</div><span class="pill ' + (e.collected ? 'green' : 'amber') + '">' + (e.collected ? 'Collected' : 'To collect') + '</span></div></button>';
        }).join('') : '');
    }).join('') + '</div>';
  return h + '</div>';
}

/* ============================================================
   INSIGHTS
   ============================================================ */
function renderInsights() {
  var rows = STATE.rows.filter(function (r) { return !r.aborted; });
  var t = today();
  var thisYear = t.getFullYear();
  var dealsThisYear = rows.filter(function (r) { return r.date && r.date.getFullYear() === thisYear; }).length;

  // renewal rate over leases that ended in the last 24 months with a known outcome
  var cut = addMonths(t, -24);
  var decided = rows.filter(function (r) { return r.isRental && r.end && r.end >= cut && r.end <= addMonths(t, 4) && (r.outcome === 'renewed' || r.outcome === 'moving'); });
  var renewed = decided.filter(function (r) { return r.outcome === 'renewed'; }).length;
  var rate = decided.length ? Math.round(renewed / decided.length * 100) : null;

  var h = renderIncome();
  h += '<div class="big-stats">' +
    '<div class="tile"><div class="v num">' + dealsThisYear + '</div><div class="k">Deals in ' + thisYear + '</div></div>' +
    '<div class="tile"><div class="v num">' + (rate == null ? '–' : rate + '%') + '</div><div class="k">Renewal rate · last 2 years</div></div>' +
    '</div>';

  // Deals per year
  var years = {};
  rows.forEach(function (r) { if (r.date) { var y = r.date.getFullYear(); years[y] = (years[y] || 0) + 1; } });
  var ys = Object.keys(years).map(Number).sort();
  if (ys.length) {
    var first = Math.max(ys[0], thisYear - 9);
    var series = [];
    for (var y = first; y <= thisYear; y++) series.push({ label: "'" + String(y).slice(2), full: String(y), v: years[y] || 0 });
    h += columnChart('Deals per year', 'Rentals and sales you closed, by deal date', series, { lastSoft: true, unit: 'deals' });
  }

  // Leases ending per month (next 12 months)
  var months = [];
  for (var i = 0; i < 12; i++) {
    var m0 = new Date(t.getFullYear(), t.getMonth() + i, 1), m1 = new Date(t.getFullYear(), t.getMonth() + i + 1, 1);
    var n = rows.filter(function (r) { return r.isRental && (r.phase === 'active' || r.phase === 'moving') && r.end >= m0 && r.end < m1; }).length;
    months.push({ label: MON[m0.getMonth()][0] + (m0.getMonth() === 0 ? "'" + String(m0.getFullYear()).slice(2) : ''), full: MON[m0.getMonth()] + ' ' + m0.getFullYear(), v: n });
  }
  h += columnChart('Leases ending', 'Active tenancies by end month · plan your renewal workload', months, { unit: 'leases' });

  // Top buildings, last 3 years
  var cut3 = addMonths(t, -36), tally = {};
  rows.forEach(function (r) { if ((r.date || r.start) >= cut3) tally[r.residence] = (tally[r.residence] || 0) + 1; });
  var top = Object.keys(tally).map(function (k) { return { k: k, v: tally[k] }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 6);
  if (top.length) {
    var max = top[0].v;
    h += '<div class="chart"><h4>Top buildings</h4><div class="cap">Most deals in the last 3 years · tap to see them</div><div class="hbars">' +
      top.map(function (b) {
        return '<button class="hbar" data-building="' + esc(b.k) + '" style="text-align:left;width:100%"><div class="top"><span>' + esc(b.k) + '</span><span class="num">' + b.v + '</span></div>' +
          '<div class="track"><i style="width:' + (b.v / max * 100).toFixed(1) + '%"></i></div></button>';
      }).join('') + '</div></div>';
  }
  document.getElementById('insightsBody').innerHTML = h;
}
function columnChart(title, cap, series, opts) {
  var max = Math.max.apply(null, series.map(function (s) { return s.v; }).concat([1]));
  var peak = series.reduce(function (a, s, i) { return s.v > series[a].v ? i : a; }, 0);
  return '<div class="chart"><h4>' + esc(title) + '</h4><div class="cap">' + esc(cap) + '</div>' +
    '<div class="cols" role="img" aria-label="' + esc(title + ': ' + series.map(function (s) { return s.full + ' ' + s.v; }).join(', ')) + '">' +
    series.map(function (s, i) {
      var last = opts.lastSoft && i === series.length - 1;
      return '<button class="col' + (i === peak || i === series.length - 1 ? ' show' : '') + '" title="' + esc(s.full + ': ' + s.v + ' ' + opts.unit) + '">' +
        '<span class="val num">' + s.v + '</span><span class="bar' + (last ? ' soft' : '') + '" style="height:' + (s.v / max * 100).toFixed(1) + '%"></span></button>';
    }).join('') + '</div><div class="xlabels">' + series.map(function (s) { return '<span>' + esc(s.label) + '</span>'; }).join('') + '</div>' +
    (opts.lastSoft ? '<div class="cap" style="margin:8px 0 0">Lighter bar = this year so far</div>' : '') + '</div>';
}

/* ============================================================

var sheetEl = document.getElementById('sheet'), scrimEl = document.getElementById('scrim');

function closeSheet() {

document.getElementById('sheetLeft').onclick = function () { if (sheetState && sheetState.onLeft) sheetState.onLeft(); else requestClose(); };
document.getElementById('sheetRight').onclick = function () { if (sheetState && sheetState.onRight) sheetState.onRight(); };
scrimEl.onclick = function () { requestClose(); };

/* Swipe down on an open sheet to close it (from the top bar, or once its content is scrolled to the top). */
(function () {
  var startY = 0, lastY = 0, lastT = 0, vel = 0, dragging = false, armed = false;
  var body = document.getElementById('sheetBody');
  sheetEl.addEventListener('touchstart', function (e) {
    if (!sheetState || e.touches.length !== 1) return;
    var inBody = body.contains(e.target);
    // inside the content only when it's already at the very top; never from text fields
    armed = !inBody || (body.scrollTop <= 0 && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName));
    startY = lastY = e.touches[0].clientY; lastT = Date.now(); vel = 0; dragging = false;
  }, { passive: true });
  sheetEl.addEventListener('touchmove', function (e) {
    if (!armed) return;
    var y = e.touches[0].clientY, dy = y - startY;
    if (!dragging) {
      if (dy > 6 && (body.scrollTop <= 0 || !body.contains(e.target))) { dragging = true; sheetEl.classList.add('dragging'); scrimEl.classList.add('dragging'); }
      else if (dy < -6) { armed = false; return; }   // scrolling up: let the content scroll
      else return;
    }
    e.preventDefault();   // stops Safari's pull-to-refresh
    var now = Date.now(); vel = (y - lastY) / Math.max(1, now - lastT); lastY = y; lastT = now;
    var d = Math.max(0, dy);
    sheetEl.style.transform = 'translateY(' + d + 'px)';
    scrimEl.style.opacity = String(Math.max(0, 1 - d / (sheetEl.offsetHeight || 600)));
  }, { passive: false });
  var end = function () {
    if (!dragging) { armed = false; return; }
    dragging = armed = false;
    sheetEl.classList.remove('dragging'); scrimEl.classList.remove('dragging');
    var d = lastY - startY;
    if (d > Math.min(140, sheetEl.offsetHeight * 0.25) || vel > 0.6) {
      if (isDirty() || (sheetState && sheetState.back)) { sheetEl.style.transform = ''; scrimEl.style.opacity = ''; requestClose(); }
      else closeSheet();
    } else { sheetEl.style.transform = ''; scrimEl.style.opacity = ''; }
  };
  sheetEl.addEventListener('touchend', end);
  sheetEl.addEventListener('touchcancel', end);
  // swiping on the dimmed background behind the sheet shouldn't refresh the page either
  scrimEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
})();

/* Press-and-hold (≈0.5 s) without moving. Ignores the WhatsApp / call / email buttons. */
function onLongPress(el, fn) {
  var t = null, x0 = 0, y0 = 0;
  var cancel = function () { clearTimeout(t); t = null; el.classList.remove('holding'); };
  var start = function (x, y, target) {
    if (target.closest('.acts, a, button')) return;
    x0 = x; y0 = y; el.classList.add('holding');
    t = setTimeout(function () { t = null; el.classList.remove('holding'); el.dataset.fired = '1'; fn(); }, 500);
  };
  el.addEventListener('touchstart', function (e) { start(e.touches[0].clientX, e.touches[0].clientY, e.target); }, { passive: true });
  el.addEventListener('touchmove', function (e) { if (t && (Math.abs(e.touches[0].clientX - x0) > 8 || Math.abs(e.touches[0].clientY - y0) > 8)) cancel(); }, { passive: true });
  el.addEventListener('touchend', cancel); el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', function (e) { if (e.button === 0) start(e.clientX, e.clientY, e.target); });
  el.addEventListener('mouseup', cancel); el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

/* Edit one person right inside the deal: the row expands to reveal the boxes. */
function expandPersonEdit(r, role, row) {
  var open = document.querySelector('#sheetBody .pe-wrap');
  if (open) { if (open.previousElementSibling === row) return; collapsePersonEdit(open); }
  var isOwner = role === 'landlord';
  var name = isOwner ? r.landlord : r.tenant, phone = r[role + 'Phone'] || '', email = r[role + 'Email'] || '';
  var field = function (id, label, val, type, mode, ph) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '"' + (type ? ' type="' + type + '"' : '') + (mode ? ' inputmode="' + mode + '"' : '') +
      ' placeholder="' + ph + '" value="' + esc(val) + '" autocomplete="off"></div>';
  };
  var wrap = document.createElement('div');
  wrap.className = 'pe-wrap';
  wrap.innerHTML = '<div class="pe-inner">' +
    field('peName', 'Name', name, '', '', 'Name') +
    (phone ? field('pePhone', 'Phone', phone, 'tel', 'tel', '012-345 6789') : '<button class="add-field" id="peAddPhone">+ Add phone</button>') +
    (email ? field('peEmail', 'Email', email, 'email', 'email', 'name@email.com') : '<button class="add-field" id="peAddEmail">+ Add email</button>') +
    '<div class="pe-btns"><button class="btn ghost" id="peCancel">Cancel</button><button class="btn primary" id="peSave">Save</button></div></div>';
  row.classList.add('editing');
  row.after(wrap);
  // animate open to its natural height (force a layout pass so the change animates)
  wrap.style.height = '0px';
  void wrap.offsetHeight;
  wrap.style.height = wrap.firstChild.scrollHeight + 'px';
  setTimeout(function () { if (wrap.isConnected && wrap.style.height !== '0px') wrap.style.height = 'auto'; }, 300);
  setTimeout(function () { wrap.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 300);

  var addBox = function (btnId, id, label, type, mode, ph) {
    bind(btnId, function () {
      var b = document.getElementById(btnId), tmp = document.createElement('div');
      tmp.innerHTML = field(id, label, '', type, mode, ph);
      b.replaceWith(tmp.firstChild); document.getElementById(id).focus();
    });
  };
  addBox('peAddPhone', 'pePhone', 'Phone', 'tel', 'tel', '012-345 6789');
  addBox('peAddEmail', 'peEmail', 'Email', 'email', 'email', 'name@email.com');

  // while open, closing the deal with changes asks first (uses the shared unsaved-changes prompt)
  sheetState.guard = 'changes';
  sheetState.snapshot = formSnapshot();
  var doSave = function () {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : null; };
    var nn = g('peName'), np = g('pePhone'), ne = g('peEmail'), patch = {};
    if (!nn) { toast('The name can’t be empty'); return; }
    if (nn !== name) patch.parties = isOwner ? (r.tenant ? nn + '/' + r.tenant : nn) : (r.landlord || '') + '/' + nn;
    if (np !== null && np !== phone) patch[role + 'Phone'] = np;
    if (ne !== null && ne !== email) patch[role + 'Email'] = ne;
    if (!Object.keys(patch).length) { collapsePersonEdit(wrap); return; }
    var finish = function () {
      save(r, patch, 'Saved ' + nn, true);
      collapsePersonEdit(wrap, function () {
        var top = document.getElementById('sheetBody').scrollTop;
        openDetail(STATE.rows[r._i]);
        document.getElementById('sheetBody').scrollTop = top;
      });
    };
    // phone / email belong to the person: offer to update their other current deals too
    var contactPatch = {};
    if (patch[role + 'Phone'] !== undefined) contactPatch[role + 'Phone'] = patch[role + 'Phone'];
    if (patch[role + 'Email'] !== undefined) contactPatch[role + 'Email'] = patch[role + 'Email'];
    var others = Object.keys(contactPatch).length ? otherCurrentDeals(r, role, name) : [];
    if (!others.length) { finish(); return; }
    chooseOtherDeals(name, r, others, contactPatch).then(function (picked) {
      if (picked === null) return;   // cancelled – keep editing
      finish();
      if (picked.length) {
        picked.forEach(function (o) { applyLocal(o, contactPatch); });
        renderCurrent();
        api('updateMany', picked.map(function (o) { return { ref: refOf(o), patch: contactPatch }; }))
          .then(function () { toast('Also updated on ' + picked.length + (picked.length === 1 ? ' other deal' : ' other deals')); afterSave(); })
          .catch(function (e) { toast('Could not update the other deals: ' + e.message); load(true); });
      }
    });
  };
  sheetState.onRight = doSave;
  bind('peSave', doSave);
  bind('peCancel', function () { collapsePersonEdit(wrap); });
  setTimeout(function () { var n = document.getElementById('peName'); if (n) n.focus({ preventScroll: true }); }, 290);
}
/* Other running leases where the same name appears in the same role. */
function otherCurrentDeals(r, role, name) {
  var key = nameTokens(name).join(' ');
  if (!key) return [];
  return STATE.rows.filter(function (o) {
    return o !== r && o.isRental && (o.phase === 'active' || o.phase === 'moving') &&
      nameTokens(role === 'landlord' ? o.landlord : o.tenant).join(' ') === key;
  }).sort(function (a, b) { return (b.residence === r.residence) - (a.residence === r.residence) || a.end - b.end; });
}
/* Checklist: which other deals should get the new phone/email? Resolves with the picked deals, or null if cancelled. */
function chooseOtherDeals(name, r, others, patch) {
  return new Promise(function (resolve) {
    var box = document.getElementById('waChoice'), scrim = document.getElementById('waScrim');
    var what = Object.keys(patch).map(function (k) { return /Phone$/.test(k) ? 'number' : 'email'; }).join(' and ');
    var picks = others.map(function (o) { return o.residence === r.residence; });
    var render = function () {
      var n = picks.filter(Boolean).length;
      box.innerHTML = '<div class="box"><div class="ttl">Also update ' + esc(name) + '\u2019s ' + what + ' on:</div>' +
        others.map(function (o, i) {
          return '<label class="od-row"><input type="checkbox" data-od="' + i + '"' + (picks[i] ? ' checked' : '') + '><span><b>' + esc(o.residence + (o.unit ? ' ' + o.unit : '')) + '</b>' +
            '<small>Ends ' + fmtDate(o.end) + (o.residence === r.residence ? ' · same building' : ' · different building – check it\u2019s the same person') + '</small></span></label>';
        }).join('') +
        '<button data-odgo="1" style="font-weight:700">' + (n ? 'Update ' + n + ' more' : 'Just this deal') + '</button>' +
        (n ? '<button data-odgo="0">Just this deal</button>' : '') + '</div>' +
        '<button class="cancel" data-odgo="-1">Keep editing</button>';
    };
    var done = function (v) { box.classList.remove('on'); scrim.classList.remove('on'); box.onclick = box.onchange = scrim.onclick = null; resolve(v); };
    box.onchange = function (e) { var c = e.target.closest('[data-od]'); if (c) { picks[+c.getAttribute('data-od')] = c.checked; render(); } };
    box.onclick = function (e) {
      e.stopPropagation();
      var b = e.target.closest('[data-odgo]'); if (!b) return;
      var v = +b.getAttribute('data-odgo');
      done(v < 0 ? null : v === 0 ? [] : others.filter(function (o, i) { return picks[i]; }));
    };
    scrim.onclick = function (e) { e.stopPropagation(); done(null); };

}
function collapsePersonEdit(wrap, then) {
  var row = wrap.previousElementSibling;
  if (row) row.classList.remove('editing');
  wrap.style.height = wrap.offsetHeight + 'px';
  void wrap.offsetHeight;

/* Forms remember what they looked like when opened, so closing can warn about unsaved changes. */
function formSnapshot() {
  var body = document.getElementById('sheetBody');
  var vals = [].map.call(body.querySelectorAll('input, textarea, select'), function (el) {
    return el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value;
  });
  var segs = [].map.call(body.querySelectorAll('.seg .on'), function (b) { return b.getAttribute('data-v'); });
  return JSON.stringify([vals, segs]);
}
function isDirty() { return !!(sheetState && sheetState.guard && sheetState.snapshot != null && formSnapshot() !== sheetState.snapshot); }
function leaveSheet() { if (sheetState && sheetState.back) sheetState.back(); else closeSheet(); }
function requestClose() {
  if (!isDirty()) { leaveSheet(); return; }
  var what = sheetState.guard;
  actionSheet('You have unsaved changes', [
    { label: 'Save ' + what, value: 'save', bold: true },
    { label: 'Discard changes', value: 'discard', danger: true }
  ], 'Keep editing').then(function (v) {
    if (v === 'save' && sheetState && sheetState.onRight) sheetState.onRight();
    else if (v === 'discard') leaveSheet();
  });
}
/* iPhone-style action sheet. Resolves with the chosen value, or null for cancel. */
function actionSheet(title, options, cancelLabel) {
  return new Promise(function (resolve) {
    var box = document.getElementById('waChoice'), scrim = document.getElementById('waScrim');
    box.innerHTML = '<div class="box"><div class="ttl">' + esc(title) + '</div>' + options.map(function (o, i) {
      return '<button data-as="' + i + '" style="' + (o.bold ? 'font-weight:700;' : '') + (o.danger ? 'color:var(--red);' : '') + '">' + esc(o.label) + '</button>';
    }).join('') + '</div><button class="cancel" data-as="-1">' + esc(cancelLabel || 'Cancel') + '</button>';
    var done = function (v) {
      box.classList.remove('on'); scrim.classList.remove('on');
      box.onclick = null; scrim.onclick = null; resolve(v);
    };
    box.onclick = function (e) {
      var b = e.target.closest('[data-as]'); if (!b) return;
      e.stopPropagation();
      var i = +b.getAttribute('data-as'); done(i < 0 ? null : options[i].value);
    };

  });
}
window.addEventListener('beforeunload', function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

function confirmBox(title, text, okLabel, danger) {

    var d = document.getElementById('dialog'), s = document.getElementById('dialogScrim');

/* iPhone only lets a web page open WhatsApp through wa.me links; iOS decides
   which WhatsApp app handles them (a "whatsapp-business://" link is rejected). */
function waLink(digits) { return 'https://wa.me/' + digits; }

var contactRowLease = null;   // the lease being shown, so its WhatsApp icons can offer the renewal message
function contactRow(label, name, phone, email, role) {
  var d = phoneDigits(phone);
  var acts = '<div class="acts">' +
    (d ? (contactRowLease && contactRowLease.isRental && (contactRowLease.phase === 'active' || contactRowLease.phase === 'moving')
        ? '<button class="round wa" data-wachoice="' + contactRowLease._i + '|' + (role === 'landlord' ? 'owner' : 'tenant') + '" aria-label="WhatsApp ' + esc(name) + '">' + ICON.wa + '</button>'
        : '<a class="round wa" href="' + waLink(d) + '" target="_blank" aria-label="WhatsApp ' + esc(name) + '">' + ICON.wa + '</a>') +

        };
      });
    }, 250);
  });
  input.addEventListener('input', function () { input.dataset.auto = ''; });
  input.addEventListener('focus', function () { loadContacts().catch(function () {}); });
  input.addEventListener('input', function () {
    clearTimeout(t);
    var q = input.value.trim();
    if (q.length < 2) { box.classList.remove('on'); return; }
    t = setTimeout(function () {
      var show = function () {
        var name = input.value.trim();
        var auto = document.getElementById('auto' + key);
        var phoneEl = document.getElementById('f' + key + 'P'), emailEl = document.getElementById('f' + key + 'E');

          fillPerson(key, one, true);
          phoneEl.dataset.auto = '1'; emailEl.dataset.auto = (one.e || []).length ? '1' : '';
          auto.innerHTML = ICON.check + '<span>Filled from ' + esc(one.n) + '</span><button data-change="' + key + '">Change</button>';
          auto.classList.add('on');
          auto.querySelector('[data-change]').onclick = function (e) {
            e.preventDefault();
            openContactPicker(key === 'Land' ? 'Choose landlord' : 'Choose tenant', name, function (c) { fillPerson(key, c, true); phoneEl.dataset.auto = '1'; auto.innerHTML = ICON.check + '<span>Filled from ' + esc(c.n) + '</span>'; auto.classList.add('on'); });
          };
          box.classList.remove('on');
          return;
        }
        if (!one && phoneEl.dataset.auto === '1') {
          // name changed and no longer clearly matches – clear what we filled
          phoneEl.value = ''; phoneEl.dataset.auto = '';
          if (emailEl.dataset.auto === '1') { emailEl.value = ''; emailEl.dataset.auto = ''; }
          document.getElementById('chips' + key).innerHTML = '';
          auto.classList.remove('on');
        }
        var hits = findContacts(name, 4);
        if (!hits.length) { box.classList.remove('on'); return; }
        box.innerHTML = hits.map(function (x) { return contactRowHtml(x.c, 'data-sugg="' + STATE.contacts.indexOf(x.c) + '"'); }).join('');
        box.classList.add('on');
        box.querySelectorAll('[data-sugg]').forEach(function (b) {
          b.onclick = function (e) { e.preventDefault(); fillPerson(key, STATE.contacts[+b.getAttribute('data-sugg')]); };
        });

function submitForm(r, prefill) {
  var s = formState();
  if (!s.residence) { toast('Add the building name'); document.getElementById('fRes').focus(); return; }
  if (!s.landlord && !s.tenant) { toast('Add the landlord or tenant'); document.getElementById('fLand').focus(); return; }
  if (s.type === 'R' && !s.start) { toast('Pick the lease start date'); document.getElementById('fStart').focus(); return; }
  if (s.type === 'R' && !s.months) { toast('How many months is the lease?'); return; }

  var rec = {
    residence: s.residence, unit: s.unit, type: s.type, price: s.price,
    parties: s.tenant ? s.landlord + '/' + s.tenant : s.landlord,
    landlordPhone: s.landlordPhone, tenantPhone: s.tenantPhone,
    landlordEmail: s.landlordEmail, tenantEmail: s.tenantEmail,
    date: s.date ? iso(s.date) : '', commission: s.fee, feeCollected: s.feeCollected ? (r && r.collectedOn ? dmy(r.collectedOn) : dmy(today())) : (s.fee ? 'No' : ''), remarks: s.remarks
  };
  if (s.type === 'R') {
    rec.start = iso(s.start); rec.tenure = tenureCell(s.months); rec.end = iso(s.end); rec.notice = iso(s.notice);
  }
  var call;
  if (prefill && prefill._renewOf) call = api('renewRecord', refOf(prefill._renewOf), rec);
  else if (r) { applyLocal(r, rec); call = api('updateRecord', refOf(r), rec); }
  else call = api('addRecord', rec);
  closeSheet();
  renderCurrent();
  var done = prefill && prefill._renewOf ? 'Renewed – new term added' : r ? 'Changes saved' : 'Deal added';
  toast(r ? done : 'Saving…');
  call.then(function () { toast(done); afterSave(); })
    .catch(function (e) { toast('Could not save: ' + e.message + ' – please try again'); load(true); });
}

function openRenew(r) {
  var start = r.end ? addDays(r.end, 1) : today();
  var months = r.months >= 12 ? (r.months % 12 === 0 ? r.months : 12) : r.months;
  openForm(null, {
    _renewOf: r, type: 'R', residence: r.raw.residence, unit: r.unit, price: r.price != null ? String(r.price) : '',
    landlord: r.landlord, landlordPhone: r.landlordPhone, tenant: r.tenant, tenantPhone: r.tenantPhone,
    landlordEmail: r.landlordEmail, tenantEmail: r.tenantEmail,
    start: iso(start), months: months, date: iso(today()), fee: '', feeCollected: false, remarks: ''
  });
  // quick rent bump chips under the rent field
  var priceField = document.getElementById('fPrice').closest('.field');
  var base = r.price;
  if (base) {
    var q = document.createElement('div'); q.className = 'quick';
    q.innerHTML = [0, 5, 10].map(function (p) { return '<button data-p="' + p + '">' + (p ? '+' + p + '%' : 'Same rent') + '</button>'; }).join('');
    priceField.after(q);
    q.querySelectorAll('button').forEach(function (b) {
