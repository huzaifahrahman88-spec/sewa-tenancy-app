}

/* ============================================================
   Match contacts – suggest phone numbers for active leases.
   Nothing is saved until she confirms.
   ============================================================ */
function leasesMissingContacts() {
  return STATE.rows.filter(function (r) {
    return r.isRental && (r.phase === 'active' || r.phase === 'moving') &&
      ((r.landlord && !r.landlordPhone) || (r.tenant && !r.tenantPhone));
  });
}
function openMatcher() {
  openSheet({ title: 'Fill from contacts', left: 'Close', right: '', body: '<div class="empty">Reading your contacts…</div>' });
  loadContacts().then(function () {
    // one decision per person name, applied to all their leases
    var people = {};
    leasesMissingContacts().forEach(function (r) {
      [['landlord', 'Landlord'], ['tenant', 'Tenant']].forEach(function (x) {
        var role = x[0], name = r[role];
        if (!name || r[role + 'Phone']) return;
        var k = nameTokens(name).join(' ');
        if (!k) return;
        if (!people[k]) people[k] = { name: name, roles: {}, leases: [] };
        people[k].roles[x[1]] = 1;
        people[k].leases.push({ r: r, role: role });
      });
    });
    var all = Object.keys(people).map(function (k) { return people[k]; });
    var clear = [], ask = [], none = 0;
    all.forEach(function (g) {
      var one = clearMatch(g.name);
      if (one) { g.contact = one; clear.push(g); return; }
      g.cands = findContacts(g.name, 3);
      g.pick = -1;
      if (g.cands.length) ask.push(g); else none++;
    });
    ask.sort(function (a, b) { return b.leases.length - a.leases.length; });
    STATE.match = { done: clear, ask: ask, none: none };
    if (!clear.length) { renderMatcher(); return; }
    renderMatcher('Filling ' + clear.length + (clear.length === 1 ? ' person' : ' people') + '…');
    api('updateMany', patchesFor(clear)).then(function () {
      clear.forEach(function (g) { g.saved = true; });
      api('syncCalendarIfOn').catch(function () {});
      toast('Filled ' + clear.length + (clear.length === 1 ? ' person' : ' people') + ' automatically');
      renderMatcher();
      load(true);
    }).catch(function (e) { renderMatcher(); toast('Could not save: ' + e.message); });
  }).catch(function (e) {
    document.getElementById('sheetBody').innerHTML = empty('⚠️', 'Could not read contacts', e.message);
  });
}
/* Sheet patches for people -> contacts (blank=true clears them again, for Undo). */
function patchesFor(groups, blank) {
  var byLease = {};
  groups.forEach(function (g) {
    var c = g.contact, ph = blank ? '' : bestPhone(c), em = blank ? '' : (c.e || [])[0] || '';
    g.leases.forEach(function (l) {
      var e = byLease[l.r._i] || (byLease[l.r._i] = { ref: refOf(l.r), patch: {} });
      e.patch[l.role + 'Phone'] = ph;
      if (blank ? g.setEmail : (em && !l.r[l.role + 'Email'])) { e.patch[l.role + 'Email'] = em; g.setEmail = !blank; }
    });
  });
  return Object.keys(byLease).map(function (k) { return byLease[k]; });
}
function whereText(g) {
  var where = g.leases.map(function (l) { return l.r.residence + (l.r.unit ? ' ' + l.r.unit : ''); });
  return Object.keys(g.roles).join(' & ') + ' · ' + where.slice(0, 2).join(', ') + (where.length > 2 ? ' +' + (where.length - 2) : '');
}
function renderMatcher(busy) {
  var m = STATE.match, h = '';
  if (!m.done.length && !m.ask.length) {
    h = empty('📇', 'Nothing to fill', m.none ? m.none + (m.none === 1 ? ' name doesn’t' : ' names don’t') + ' match any contact – add those with Edit.' : 'Every active lease already has phone numbers.');
  }
  if (m.done.length) {
    h += '<div class="group-label" style="margin-top:4px">' + (busy ? busy : 'Filled automatically') + '</div><div class="match-card">' +
      m.done.map(function (g, i) {
        return '<div class="done-row' + (g.undone ? ' undone' : '') + '"><span class="cav">' + esc(initials(g.contact.n)) + '</span><span class="cmain"><b>' + esc(g.name) + ' → ' + esc(g.contact.n) + '</b><span>' + esc(bestPhone(g.contact) + ' · ' + whereText(g)) + '</span></span>' +
          (busy ? '' : '<button class="undo" data-undo="' + i + '">' + (g.undone ? 'Undone' : 'Undo') + '</button>') + '</div>';
      }).join('') + '</div>';
  }
  if (m.ask.length) {
    h += '<div class="group-label">Which one? (' + m.ask.length + ')</div><div class="hint" style="margin:0 6px 12px">These names match more than one contact. Pick the right person, then tap <b>Save</b>.</div>';
    h += m.ask.map(function (g, gi) {
      return '<div class="match-card"><div class="mh"><b>' + esc(g.name) + '</b><span>' + esc(whereText(g)) + '</span></div>' +
        g.cands.map(function (x, ci) {
          return '<button class="mopt' + (g.pick === ci ? ' on' : '') + '" data-mg="' + gi + '" data-mc="' + ci + '"><span class="radio"></span><span class="cav">' + esc(initials(x.c.n)) + '</span><span class="cmain"><b>' + esc(x.c.n) + '</b><span>' + esc(contactLine(x.c)) + '</span></span></button>';
        }).join('') +
        '<button class="mopt" data-more="' + gi + '"><span class="radio" style="border-style:dashed"></span><span class="skip">Someone else… (search contacts)</span></button>' +
        '<button class="mopt' + (g.pick === -1 ? ' on' : '') + '" data-mg="' + gi + '" data-mc="-1"><span class="radio"></span><span class="skip">Skip for now</span></button></div>';
    }).join('');
  }
  if (m.none && (m.done.length || m.ask.length)) h += '<div class="hint" style="margin:6px 6px 0">' + m.none + (m.none === 1 ? ' name doesn’t' : ' names don’t') + ' match any contact – add those with Edit.</div>';
  var body = document.getElementById('sheetBody'), top = body.scrollTop;
  body.innerHTML = h; body.scrollTop = top;

  var chosen = m.ask.filter(function (g) { return g.pick >= 0; }).length;
  var right = document.getElementById('sheetRight');
  right.textContent = chosen ? 'Save ' + chosen : '';
  right.style.visibility = chosen ? 'visible' : 'hidden';
  right.disabled = false;
  sheetState.onRight = saveMatches;
  body.querySelectorAll('[data-mg]').forEach(function (b) {
    b.onclick = function () { m.ask[+b.getAttribute('data-mg')].pick = +b.getAttribute('data-mc'); renderMatcher(); };
  });
  body.querySelectorAll('[data-more]').forEach(function (b) {
    b.onclick = function () {
      var g = m.ask[+b.getAttribute('data-more')];
      openContactPicker('Contact for ' + g.name, g.name.split(' ')[0], function (c) {
        if (!g.cands.some(function (x) { return x.c === c; })) g.cands.unshift({ c: c, s: 0 });
        g.pick = g.cands.map(function (x) { return x.c; }).indexOf(c);
        renderMatcher();
      });
    };
  });
  body.querySelectorAll('[data-undo]').forEach(function (b) {
    b.onclick = function () {
      var g = m.done[+b.getAttribute('data-undo')];
      if (g.undone) return;
      b.textContent = '…';
      api('updateMany', patchesFor([g], true)).then(function () { g.undone = true; renderMatcher(); toast('Removed ' + g.name + '’s number'); load(true); })
        .catch(function (e) { toast('Could not undo: ' + e.message); renderMatcher(); });
    };
  });
}
function saveMatches() {
  var picked = STATE.match.ask.filter(function (g) { return g.pick >= 0; });
  if (!picked.length) return;
  picked.forEach(function (g) { g.contact = g.cands[g.pick].c; });
  document.getElementById('sheetRight').disabled = true;
  toast('Saving…');
  api('updateMany', patchesFor(picked)).then(function (res) {
    STATE.match.ask = STATE.match.ask.filter(function (g) { return g.pick < 0; });
    picked.forEach(function (g) { g.saved = true; STATE.match.done.push(g); });
    toast('Saved ' + picked.length + (picked.length === 1 ? ' person' : ' people'));
    renderMatcher(); load(true);
  }).catch(function (e) { document.getElementById('sheetRight').disabled = false; toast('Could not save: ' + e.message); });
}

    return;
  }
  // "Open": WhatsApp opens with the text typed in – nothing is sent or recorded yet.
  var wa = e.target.closest('[data-wa]');
  if (wa) {
    var wk = wa.getAttribute('data-wa');
    setTimeout(function () { STATE.opened[wk] = true; refreshMsgViews(wk); }, 400);
    return;
  }
  var cf = e.target.closest('[data-confirm]') || e.target.closest('[data-notyet]');
  if (cf) {
    var ck = cf.getAttribute('data-confirm') || cf.getAttribute('data-notyet');
    var parts = ck.split('|'), cr = STATE.rows[+parts[0]];
    delete STATE.opened[ck];
    if (cf.hasAttribute('data-confirm')) { markSent(cr, parts[1]); }
    refreshMsgViews(ck);
    return;
  }
  var o = e.target.closest('[data-open]');
  if (o) { openDetail(STATE.rows[+o.getAttribute('data-open')]); return; }
  var j = e.target.closest('[data-jump]');
  if (j) { goSearch('', j.getAttribute('data-jump')); return; }
  var nf = e.target.closest('[data-nfilter]');
  if (nf) { STATE.noteFilter = nf.getAttribute('data-nfilter'); renderNotes(); return; }
  var f = e.target.closest('[data-filter]');
  if (f) { STATE.filter = f.getAttribute('data-filter'); STATE.limit = 60; renderList(); return; }
  var mk = e.target.closest('[data-month]');
  if (mk) { STATE.incomeMonth = +mk.getAttribute('data-month'); var y = window.scrollY; renderInsights(); window.scrollTo(0, y); return; }
  var b = e.target.closest('[data-building]');
  if (b) { goSearch(b.getAttribute('data-building')); return; }
  var tb = e.target.closest('[data-tab]');
  if (tb) { setTab(tb.getAttribute('data-tab')); return; }
  var c = e.target.closest('.col');
  if (c) { var sib = c.parentNode.querySelectorAll('.col'); sib.forEach(function (x) { x.classList.remove('sel'); }); c.classList.add('sel', 'show'); return; }
  if (e.target.id === 'showMore') { STATE.limit += 60; renderList(); }
});
document.getElementById('pickerCancel').onclick = closePicker;
document.getElementById('pq').addEventListener('input', function () { if (STATE.contacts) renderPicker(); });
document.getElementById('pickerList').addEventListener('click', function (e) {
  var b = e.target.closest('[data-pick]'); if (!b) return;
  var c = STATE.contacts[+b.getAttribute('data-pick')], cb = pickerCb;
  closePicker(); if (cb) cb(c);
});
document.getElementById('addBtn').onclick = function () { openForm(null); };
document.getElementById('settingsBtn').onclick = openSettings;
document.getElementById('refreshBtn').onclick = function () { load(); };
document.getElementById('nq').addEventListener('input', function () {
  STATE.nq = this.value; clearTimeout(qTimer); qTimer = setTimeout(renderNotes, 120);
});
var qTimer;
document.getElementById('q').addEventListener('input', function () {
  var v = this.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(function () {
    var had = !!STATE.q.trim();
    STATE.q = v; STATE.limit = 60;
    if (v.trim() && !had && STATE.filter === 'active') STATE.filter = 'all';
    if (!v.trim() && had) STATE.filter = 'active';
    renderList();
  }, 120);
});
document.getElementById('qClear').onclick = function () { document.getElementById('q').value = ''; STATE.q = ''; STATE.filter = 'active'; renderList(); };
// Pick up edits made directly in the sheet when she comes back to the app.
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && STATE.loaded && Date.now() - STATE.lastLoad > 30000 && !sheetState) load(true);
});

load();
</script>
</body>
</html>
